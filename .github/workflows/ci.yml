name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Game tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Expansion render check
        run: npm run test:render
      - name: Production build
        run: npm run build
